<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eaglercraft 26.2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
	html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
	#game-container { position: fixed; inset: 0; }
	canvas { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
	#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
		color: #cfc; font-family: monospace; font-size: 18px; z-index: 5; background: #001; }
	.hidden { display: none !important; }
</style>
</head>
<body>
<div id="game-container">
	<canvas id="game-canvas" tabindex="0" style="width:100%;height:100%;"></canvas>
</div>
<div id="loading">Loading Eaglercraft 26.2… <span id="loadstatus"></span></div>
<script src="classes.js"></script>
<script>
	// TeaVM emits an entry point named "main" after classes.js loads.
	// Deferred so browser-capability probing (JSO) completed first.
	window.addEventListener('load', function () {
		document.getElementById('loading').classList.add('hidden');
		try {
			if (typeof main === 'function') { main(); } else { main_(); }
		} catch (e) {
			document.getElementById('loadstatus').textContent = ' (error: ' + e + ')';
		}
	});
</script>
</body>
</html>
